{% extends "base.html" %}

{% block content %}
<div class="auth-card">
    <h1>Set Your Password</h1>

    <form method="POST">
        <label for="current_password">
            Current or Temporary Password
        </label>

        <input
            id="current_password"
            name="current_password"
            type="password"
            required
        >

        <label for="new_password">New Password</label>

        <input
            id="new_password"
            name="new_password"
            type="password"
            minlength="8"
            required
        >

        <label for="confirm_password">
            Confirm New Password
        </label>

        <input
            id="confirm_password"
            name="confirm_password"
            type="password"
            minlength="8"
            required
        >

        <button type="submit">Save New Password</button>
    </form>
</div>
{% endblock %}
