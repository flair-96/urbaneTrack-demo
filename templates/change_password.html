{% extends "base.html" %}

{% block content %}

<div class="auth-card">

    <h1>Set Your Password</h1>

    <form method="POST" class="form">

        <label for="current_password">
            Current / Temporary Password
        </label>

        <input
            type="password"
            id="current_password"
            name="current_password"
            required
        >

        <label for="new_password">
            New Password
        </label>

        <input
            type="password"
            id="new_password"
            name="new_password"
            required
        >

        <label for="confirm_password">
            Confirm New Password
        </label>

        <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            required
        >

        <button
            type="submit"
            class="btn primary"
        >
            Save New Password
        </button>

    </form>

</div>

{% endblock %}
