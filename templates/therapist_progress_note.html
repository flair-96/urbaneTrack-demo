<div class="form-group">
    <label for="goal_score">Goal Achievement (%)</label>
    <input
        type="number"
        id="goal_score"
        name="goal_score"
        min="0"
        max="100"
        required
    >
</div>

<div class="form-group">
    <label for="attendance_rate">Attendance Rate (%)</label>
    <input
        type="number"
        id="attendance_rate"
        name="attendance_rate"
        min="0"
        max="100"
        required
    >
</div>

<div class="form-group">
    <label for="therapist_rating">Therapist Rating</label>
    <select
        id="therapist_rating"
        name="therapist_rating"
        required
    >
        <option value="">Select rating</option>
        <option value="1">1 - Very Poor</option>
        <option value="2">2 - Poor</option>
        <option value="3">3 - Moderate</option>
        <option value="4">4 - Good</option>
        <option value="5">5 - Excellent</option>
    </select>
</div>
